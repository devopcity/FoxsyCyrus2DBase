name: Build and Release

on:
  # FoxLeague: the release tag is given, not "latest tag + 1" (that would collide with the
  # upstream numbering this fork inherited), and the tag is created on the commit that was
  # built (github.sha), not on the default branch.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. foxleague-564-1)"
        required: true
  # push:
  #   branches:
  #     - cyrus2d

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libboost-all-dev cmake

      - name: Install librcsc
        run: |
          git clone https://github.com/helios-base/librcsc.git
          cd librcsc
          git checkout 19175f339dcb5c3f61b56a8c1bff5345109f22ef
          mkdir build
          cd build
          cmake ..
          make
          sudo make install

      - name: Build project
        run: |
          mkdir build
          cd build
          cmake ..
          make
          cd bin
          mkdir lib
          cp ~/local/lib/libr* lib/

      - name: Create zip file
        run: |
          cd build
          mv bin cyrus
          chmod 777 cyrus/* -R
          zip -r cyrus.zip cyrus
          mv cyrus.zip ../
      # ------------------------------------------- Release
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ github.workspace }}/cyrus.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ inputs.tag }}
          body: "FOXSY CYRUS BASE, FoxLeague build: like-for-like substitutions (#564). Built from ${{ github.sha }}."
          draft: false
          prerelease: false
